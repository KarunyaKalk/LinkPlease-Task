version: '3.8'

services:
  backend:
    build: .
    container_name: instagram_automation_backend
    ports:
      - "8000:8000"
    environment:
      - DB_PATH=/data/app.db
      - PSEUDOGRAM_API_URL=${PSEUDOGRAM_API_URL:-https://pseudogram-api.onrender.com}
      - PSEUDOGRAM_API_KEY=${PSEUDOGRAM_API_KEY:-pseudogram_secret_key}
    volumes:
      - sqlite_data:/data
    restart: unless-stopped

volumes:
  sqlite_data:
    driver: local
